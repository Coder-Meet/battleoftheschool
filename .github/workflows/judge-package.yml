name: Minimal judge application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
      - name: Prepare only the inference wheels
        run: python -m pip download --only-binary=:all: -r application/requirements.txt --dest wheelhouse
      - name: Install without a package index
        run: python -m pip install --no-index --only-binary=:all: --find-links wheelhouse -r application/requirements.txt
      - name: Verify minimal dependency closure
        run: |
          python -m pip check
          python -c "import importlib.util; assert all(importlib.util.find_spec(m) is None for m in ('matplotlib', 'sklearn', 'torch', 'onnxruntime'))"
      - name: Build the standalone archive
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python application/build.py --output-dir package --windows-wheelhouse wheelhouse
          else
            python application/build.py --output-dir package
          fi
      - name: Install the test harness
        run: python -m pip install pytest==8.4.1
      - name: Verify extracted CLI, model integrity and packaging
        run: python -m pytest -q tests/test_judge_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: judge-package-${{ matrix.os }}
          path: package/
