name: Prototype regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check . && mypy && python -m pytest -q
      - name: Verify offline inference and candidate training
        env:
          BRANCHSEED_NETWORK_BLOCKED: '1'
          OPENBLAS_NUM_THREADS: '4'
          OMP_NUM_THREADS: '4'
        run: |
          strace -f -e trace=%network -e inject=%network:error=ENETUNREACH \
            -o offline-network.log python -m pytest -q tests/test_offline.py \
            tests/test_detector.py tests/test_input_validation.py tests/test_learning.py \
            tests/test_synthetic.py tests/test_accuracy.py
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm test && npm run build
        working-directory: web
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
      ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
      - name: Prepare wheels while online
        run: python -m pip download --only-binary=:all: -r requirements-dev.txt --dest wheelhouse
      - name: Install without a package index
        run: python -m pip install --no-index --find-links wheelhouse -r requirements-dev.txt
      - name: Check Windows inference, geometry and review tooling
        run: |
          python -m ruff check .
          python -m mypy
          python -m pytest -q --junitxml=windows-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-python-results
          path: windows-results.xml
