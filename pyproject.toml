[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
files = [
    "detector.py", "run.py", "nifti_io.py", "explorer.py", "batch.py", "evaluate.py",
    "learning.py", "synthetic.py", "benchmark.py", "stress.py", "score_references.py",
    "prepare_annotations.py", "autolabel.py", "synthetic_reviews.py", "labels_to_references.py",
    "compare_e2e.py", "paper_methods.py", "candidate_patches.py", "tabular_learning.py",
    "train_trees.py", "patch_learning.py", "patch_inference.py", "research_corpus.py",
    "research_validation.py", "research_run.py", "research_resources.py", "research_reproduce.py",
    "review_analytics.py", "pipeline.py",
    "final_evaluation.py", "application/build.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
