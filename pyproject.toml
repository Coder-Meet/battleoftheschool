[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
files = ["detector.py", "run.py", "nifti_io.py", "explorer.py", "batch.py", "evaluate.py", "learning.py", "synthetic.py", "benchmark.py", "stress.py", "score_references.py", "prepare_annotations.py", "autolabel.py", "synthetic_reviews.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
